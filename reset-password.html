<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu - Folio & Quill</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- CSS RIÊNG của trang đặt lại mật khẩu -->
  <style>
    .password-card {
      max-width: 28rem;
      width: 100%;
      margin: 2rem auto 0;
      padding: 2rem;
    }

    .password-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .password-header-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 0.75rem;
      background: var(--primary);
      color: #ffffff;
      display: grid;
      place-items: center;
      margin: 0 auto 0.75rem;
    }
    .password-header-icon .lucide {
      width: 1.375rem;
      height: 1.375rem;
    }
    .password-title {
      font-size: 1.5rem;
      font-weight: 800;
    }
    .password-subtitle {
      font-size: 0.875rem;
      color: var(--on-surface-variant);
    }

    /* Khối cảnh báo khi URL không có ?token=... */
    .password-invalid {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .password-invalid .lucide {
      width: 2.5rem;
      height: 2.5rem;
      color: var(--error);
    }
    .password-invalid-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .password-back {
      text-align: center;
      margin-top: 1.25rem;
    }
    .password-back a {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.875rem;
      color: var(--primary);
      font-weight: 600;
    }
    .password-back .lucide {
      width: 0.875rem;
      height: 0.875rem;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header" id="site-header"></header>

    <main class="site-main">
      <!-- Trường hợp bình thường: có token trong URL -->
      <section class="card card-elevated password-card" id="khoi-doi-mat-khau">
        <div class="password-header">
          <div class="password-header-icon"><i data-lucide="key-round"></i></div>
          <h1 class="password-title">Đặt lại mật khẩu</h1>
          <p class="password-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
        </div>

        <form id="form-dat-lai" class="form-stack">
          <div class="form-field">
            <label class="form-label" for="password">Mật khẩu mới</label>
            <div class="input-icon-wrap">
              <i data-lucide="lock" class="input-icon"></i>
              <input
                id="password"
                class="form-input form-input-with-icon form-input-with-toggle"
                type="password"
                placeholder="≥ 6 ký tự"
                minlength="6"
                required
              />
              <button type="button" class="password-toggle" data-password-toggle aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label class="form-label" for="confirm">Xác nhận mật khẩu</label>
            <div class="input-icon-wrap">
              <i data-lucide="lock" class="input-icon"></i>
              <input
                id="confirm"
                class="form-input form-input-with-icon form-input-with-toggle"
                type="password"
                placeholder="Nhập lại mật khẩu"
                minlength="6"
                required
              />
              <button type="button" class="password-toggle" data-password-toggle aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="nut-dat-lai" class="btn btn-primary btn-block btn-lg">Đặt lại mật khẩu</button>
        </form>

        <p class="password-back">
          <a href="login.html"><i data-lucide="arrow-left"></i> Quay lại đăng nhập</a>
        </p>
      </section>

      <!-- Trường hợp thiếu token: hiện cảnh báo, ẩn form phía trên -->
      <section class="card card-elevated password-card password-invalid" id="khoi-thieu-token" hidden>
        <i data-lucide="key-round"></i>
        <h1 class="password-invalid-title">Liên kết không hợp lệ</h1>
        <p class="password-subtitle">
          Liên kết đặt lại mật khẩu bị thiếu hoặc hết hạn. Vui lòng yêu cầu liên kết mới.
        </p>
        <a href="forgot-password.html" class="btn btn-primary">Yêu cầu liên kết mới</a>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    import { thongBao } from './js/toast.js';
    import { dungKhungKhachHang, veIcon } from './js/layout.js';
    import { tuDongXoaLoi, kiemTraForm } from './js/validate.js';

    // Token nằm trong URL: reset-password.html?token=...
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('form-dat-lai');
    const nutGui = document.getElementById('nut-dat-lai');

    /** Kiểm tra 2 ô mật khẩu rồi gọi API đặt lại mật khẩu */
    async function xuLyDatLaiMatKhau(suKien) {
      suKien.preventDefault();

      // Validate: đủ 6 ký tự và ô xác nhận phải khớp ô mật khẩu mới
      const ketQua = kiemTraForm(
        [
          { id: 'password', label: 'Mật khẩu mới', rules: ['required', 'minLength:6', 'maxLength:64'] },
          { id: 'confirm', label: 'Xác nhận mật khẩu', rules: ['required', 'match:password'] },
        ],
        form,
        thongBao,
      );
      if (!ketQua) return;

      nutGui.disabled = true;
      nutGui.textContent = 'Đang lưu...';

      try {
        // Gửi token + mật khẩu mới cho backend
        const duLieu = await api.post('/auth/reset-password', { token, password: ketQua.values.password });
        thongBao.thanhCong(duLieu.message);
        setTimeout(() => (location.href = 'login.html'), 1000);
      } catch (loi) {
        thongBao.loi(loi?.response?.data?.message || 'Đặt lại mật khẩu thất bại');
        nutGui.disabled = false;
        nutGui.textContent = 'Đặt lại mật khẩu';
      }
    }

    dungKhungKhachHang('');

    if (!token) {
      // Thiếu token → chỉ hiện khối cảnh báo
      document.getElementById('khoi-doi-mat-khau').hidden = true;
      document.getElementById('khoi-thieu-token').hidden = false;
    } else {
      tuDongXoaLoi(form);
      form.addEventListener('submit', xuLyDatLaiMatKhau);
    }

    veIcon();
  </script>
</body>
</html>
