<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Folio & Quill</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- CSS RIÊNG của trang quên mật khẩu -->
  <style>
    .password-card {
      max-width: 28rem;
      width: 100%;
      margin: 2rem auto 0;
      padding: 2rem;
    }

    .password-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .password-header-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 0.75rem;
      background: var(--primary);
      color: #ffffff;
      display: grid;
      place-items: center;
      margin: 0 auto 0.75rem;
    }
    .password-header-icon .lucide {
      width: 1.375rem;
      height: 1.375rem;
    }
    .password-title {
      font-size: 1.5rem;
      font-weight: 800;
    }
    .password-subtitle {
      font-size: 0.875rem;
      color: var(--on-surface-variant);
    }

    /* Khối hiện sau khi gửi email thành công */
    .password-sent {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .password-sent-text {
      font-size: 0.875rem;
      color: var(--on-surface-variant);
    }

    /* Link "Quay lại đăng nhập" ở đáy thẻ */
    .password-back {
      text-align: center;
      margin-top: 1.25rem;
    }
    .password-back a {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.875rem;
      color: var(--primary);
      font-weight: 600;
    }
    .password-back .lucide {
      width: 0.875rem;
      height: 0.875rem;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header" id="site-header"></header>

    <main class="site-main">
      <section class="card card-elevated password-card">
        <div class="password-header">
          <div class="password-header-icon"><i data-lucide="key-round"></i></div>
          <h1 class="password-title">Quên mật khẩu</h1>
          <p class="password-subtitle" id="mo-ta-trang">
            Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu
          </p>
        </div>

        <!-- Bước 1: nhập email -->
        <form id="form-quen-mat-khau" class="form-stack">
          <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <div class="input-icon-wrap">
              <i data-lucide="mail" class="input-icon"></i>
              <input
                id="email"
                class="form-input form-input-with-icon"
                type="email"
                placeholder="email@example.com"
                required
              />
            </div>
          </div>
          <button type="submit" id="nut-gui" class="btn btn-primary btn-block btn-lg">Gửi liên kết đặt lại</button>
        </form>

        <!-- Bước 2: đã gửi email (ẩn cho tới khi gửi xong) -->
        <div id="khoi-da-gui" class="password-sent" hidden>
          <p class="password-sent-text">
            Nếu email <b id="email-da-gui"></b> tồn tại, bạn sẽ nhận được hướng dẫn trong vài phút.
            Liên kết có hiệu lực <b>1 giờ</b>.
          </p>
          <button type="button" id="nut-gui-lai" class="btn btn-outline btn-block">Gửi lại</button>
        </div>

        <p class="password-back">
          <a href="login.html"><i data-lucide="arrow-left"></i> Quay lại đăng nhập</a>
        </p>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    import { thongBao } from './js/toast.js';
    import { dungKhungKhachHang, veIcon } from './js/layout.js';
    import { tuDongXoaLoi, kiemTraForm } from './js/validate.js';

    const form = document.getElementById('form-quen-mat-khau');
    const nutGui = document.getElementById('nut-gui');
    const khoiDaGui = document.getElementById('khoi-da-gui');
    const moTaTrang = document.getElementById('mo-ta-trang');

    /** Bật/tắt giữa 2 bước: nhập email và đã gửi email */
    function hienBuocDaGui(daGui, email) {
      form.hidden = daGui;
      khoiDaGui.hidden = !daGui;
      moTaTrang.textContent = daGui
        ? 'Kiểm tra hộp thư của bạn để đặt lại mật khẩu'
        : 'Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu';
      // textContent tự escape nên không sợ XSS
      if (email) document.getElementById('email-da-gui').textContent = email;
    }

    /** Kiểm tra email rồi gọi API gửi liên kết đặt lại mật khẩu */
    async function xuLyGuiYeuCau(suKien) {
      suKien.preventDefault();

      const ketQua = kiemTraForm([{ id: 'email', label: 'Email', rules: ['required', 'email'] }], form, thongBao);
      if (!ketQua) return;

      const email = ketQua.values.email.trim();
      nutGui.disabled = true;
      nutGui.textContent = 'Đang gửi...';

      try {
        // Backend luôn trả thông báo chung để không tiết lộ email có tồn tại hay không
        const duLieu = await api.post('/auth/forgot-password', { email });
        thongBao.thanhCong(duLieu.message);
        hienBuocDaGui(true, email);
      } catch (loi) {
        thongBao.loi(loi?.response?.data?.message || 'Gửi yêu cầu thất bại');
      } finally {
        nutGui.disabled = false;
        nutGui.textContent = 'Gửi liên kết đặt lại';
      }
    }

    dungKhungKhachHang('');
    tuDongXoaLoi(form);
    form.addEventListener('submit', xuLyGuiYeuCau);
    document.getElementById('nut-gui-lai').addEventListener('click', () => hienBuocDaGui(false));
    veIcon();
  </script>
</body>
</html>
