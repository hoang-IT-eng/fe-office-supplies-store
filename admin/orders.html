<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý đơn hàng - Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />

  <!-- CSS RIÊNG của trang quản lý đơn hàng -->
  <style>
    /* Hàng chip lọc theo trạng thái đơn */
    .order-filter-bar {
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Danh sách đơn: mỗi đơn là 1 card bấm được để mở chi tiết */
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .order-card {
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
      align-items: center;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      cursor: pointer;
    }
    .order-card:hover {
      box-shadow: var(--shadow-elevated);
    }

    .order-card-code {
      font-weight: 700;
    }
    .order-card-date {
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }

    /* Cột khách hàng: tên + số điện thoại */
    .order-card-customer {
      font-size: 0.875rem;
    }
    .order-card-name,
    .order-card-phone {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .order-card-name .lucide {
      width: 0.875rem;
      height: 0.875rem;
      color: var(--on-surface-variant);
    }
    .order-card-phone {
      font-size: 0.75rem;
      color: var(--on-surface-variant);
    }
    .order-card-phone .lucide {
      width: 0.75rem;
      height: 0.75rem;
    }

    /* Cột địa chỉ: dài quá thì cắt còn 2 dòng */
    .order-card-address {
      font-size: 0.875rem;
      display: flex;
      align-items: flex-start;
      gap: 0.25rem;
      color: var(--on-surface-variant);
    }
    .order-card-address .lucide {
      width: 0.875rem;
      height: 0.875rem;
      margin-top: 2px;
    }
    .order-card-address-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .order-card-total {
      text-align: right;
      font-weight: 800;
      color: var(--primary);
    }

    /* Cột cuối: ô chọn trạng thái mới + chip trạng thái hiện tại */
    .order-card-status {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .order-card-status-chip {
      text-align: center;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-aside" id="admin-aside"></aside>

    <main class="admin-content">
      <div class="admin-page">
        <!-- Tiêu đề trang -->
        <div>
          <div class="admin-kicker">
            <span class="ms material-symbols-outlined">shopping_cart_checkout</span>
            <span>Theo dõi vận hành đơn hàng</span>
          </div>
          <h1 class="page-title" style="margin-top:.25rem">Quản lý đơn hàng</h1>
          <div class="page-subtitle">
            <i data-lucide="receipt"></i>
            <p>Theo dõi và cập nhật trạng thái đơn hàng.</p>
          </div>
          <p id="goi-y-tim" class="product-count-note muted" hidden style="margin-top:.35rem;font-size:.85rem"></p>
        </div>

        <!-- Chip lọc theo trạng thái (JS đổ số lượng vào từng chip) -->
        <div class="card order-filter-bar" id="thanh-loc-trang-thai"></div>

        <!-- Danh sách đơn hàng -->
        <div class="order-list" id="danh-sach-don">
          <div class="loading-block">Đang tải...</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '../js/api.js';
    import { duongDanTrang } from '../js/config.js';
    import { dinhDangTien, dinhDangNgay, nhanTrangThaiDon, chipTrangThaiDon, chuoiAnToan } from '../js/format.js';
    import { thongBao } from '../js/toast.js';
    import { dungKhungAdmin, veIcon, batBuocAdmin } from '../js/layout.js';

    const thanhLocEl = document.getElementById('thanh-loc-trang-thai');
    const danhSachEl = document.getElementById('danh-sach-don');

    // Các trạng thái đơn của backend và trạng thái được phép chuyển tiếp
    const CAC_TRANG_THAI = ['PENDING', 'CONFIRMED', 'SHIPPING', 'COMPLETED', 'CANCELLED'];
    const TRANG_THAI_KE_TIEP = {
      PENDING: ['CONFIRMED', 'CANCELLED'],
      CONFIRMED: ['SHIPPING', 'CANCELLED'],
      SHIPPING: ['COMPLETED', 'CANCELLED'],
      COMPLETED: [],
          CANCELLED: [],
    };

    let danhSachDon = [];
    let trangThaiDangLoc = ''; // '' = xem tất cả
    const tuKhoaTim = new URLSearchParams(location.search).get('q')?.trim().toLowerCase() || '';

    /** Đếm số đơn theo từng trạng thái để hiện lên chip lọc */
    function demTheoTrangThai() {
      const soLuong = {};
      CAC_TRANG_THAI.forEach((trangThai) => {
        soLuong[trangThai] = danhSachDon.filter((don) => don.status === trangThai).length;
      });
      return soLuong;
    }

    /** Vẽ hàng chip lọc trạng thái */
    function veThanhLoc() {
      const soLuong = demTheoTrangThai();

      const taoChip = (giaTri, nhan) => `
        <button type="button" class="chip chip-button ${trangThaiDangLoc === giaTri ? 'chip-primary' : 'chip-neutral'}"
          data-loc="${giaTri}">${nhan}</button>`;

      thanhLocEl.innerHTML =
        taoChip('', `Tất cả (${danhSachDon.length})`) +
        CAC_TRANG_THAI.map((trangThai) =>
          taoChip(trangThai, `${nhanTrangThaiDon[trangThai]} (${soLuong[trangThai] || 0})`),
        ).join('');

      thanhLocEl.querySelectorAll('[data-loc]').forEach((nut) =>
        nut.addEventListener('click', () => {
          trangThaiDangLoc = nut.dataset.loc;
          veThanhLoc();
          veDanhSachDon();
        }),
      );
    }

    /** Tạo HTML cho 1 card đơn hàng */
    function taoHtmlCardDon(don) {
      // Chỉ cho chọn trạng thái hiện tại và các trạng thái được phép chuyển tiếp
      const cacTrangThaiChon = [don.status, ...(TRANG_THAI_KE_TIEP[don.status] || [])];
      const khongDoiDuoc = (TRANG_THAI_KE_TIEP[don.status] || []).length === 0;

      const cacOption = cacTrangThaiChon
        .map(
          (trangThai) =>
            `<option value="${trangThai}" ${don.status === trangThai ? 'selected' : ''}>${
              nhanTrangThaiDon[trangThai]
            }</option>`,
        )
        .join('');

      return `
        <div class="card order-card" data-mo="${chuoiAnToan(don.id)}">
          <div>
            <div class="mono order-card-code">#${chuoiAnToan(don.code)}</div>
            <div class="muted order-card-date">${dinhDangNgay(don.createdAt)}</div>
          </div>

          <div class="order-card-customer">
            <div class="order-card-name">
              <i data-lucide="user"></i> ${chuoiAnToan(don.user?.fullName || '')}
            </div>
            <div class="order-card-phone">
              <i data-lucide="phone"></i> ${chuoiAnToan(don.shippingPhone || '')}
            </div>
          </div>

          <div class="order-card-address">
            <i data-lucide="map-pin"></i>
            <span class="order-card-address-text">${chuoiAnToan(don.shippingAddress || '')}</span>
          </div>

          <div class="order-card-total">${dinhDangTien(don.totalAmount)}</div>

          <div class="order-card-status">
            <select class="form-input" data-trang-thai="${chuoiAnToan(don.id)}" ${khongDoiDuoc ? 'disabled' : ''}>
              ${cacOption}
            </select>
            <div class="order-card-status-chip">
              <span class="chip ${chipTrangThaiDon[don.status] || 'chip-neutral'}">${nhanTrangThaiDon[don.status]}</span>
            </div>
          </div>
        </div>`;
    }

    /** Vẽ danh sách đơn theo trạng thái đang lọc (+ từ khóa ?q= từ topbar) */
    function veDanhSachDon() {
      let danhSachDaLoc =
        trangThaiDangLoc === '' ? danhSachDon : danhSachDon.filter((don) => don.status === trangThaiDangLoc);
      if (tuKhoaTim) {
        danhSachDaLoc = danhSachDaLoc.filter((don) => {
          const haystack = [
            don.code,
            don.user?.fullName,
            don.shippingName,
            don.shippingPhone,
            don.shippingAddress,
          ]
            .join(' ')
            .toLowerCase();
          return haystack.includes(tuKhoaTim);
        });
      }

      if (danhSachDaLoc.length === 0) {
        danhSachEl.innerHTML = `<div class="card empty-block">${
          tuKhoaTim ? `Không tìm thấy đơn khớp “${chuoiAnToan(tuKhoaTim)}”` : 'Không có đơn hàng nào'
        }</div>`;
        return;
      }

      danhSachEl.innerHTML = danhSachDaLoc.map(taoHtmlCardDon).join('');
      ganSuKienDanhSach();
      veIcon();
    }

    /** Bấm card → mở chi tiết đơn; đổi ô select → cập nhật trạng thái */
    function ganSuKienDanhSach() {
      danhSachEl.querySelectorAll('[data-mo]').forEach((card) =>
        card.addEventListener('click', () => {
          location.href = duongDanTrang('order-detail.html', { id: card.dataset.mo });
        }),
      );

      danhSachEl.querySelectorAll('[data-trang-thai]').forEach((oChon) => {
        // Chặn click lan ra card cha để không nhảy sang trang chi tiết
        oChon.addEventListener('click', (suKien) => suKien.stopPropagation());
        oChon.addEventListener('change', (suKien) => {
          suKien.stopPropagation();
          xuLyDoiTrangThai(oChon.dataset.trangThai, oChon.value);
        });
      });
    }

    /** Gọi API đổi trạng thái 1 đơn hàng */
    async function xuLyDoiTrangThai(id, trangThai) {
      try {
        await api.patch(`/orders/${id}/status`, { status: trangThai });
        thongBao.thanhCong('Đã cập nhật trạng thái');
        await taiDanhSach();
      } catch (loi) {
        thongBao.loi(loi?.response?.data?.message || 'Không cập nhật được trạng thái');
      }
    }

    /** Gọi API lấy toàn bộ đơn hàng rồi vẽ lại chip lọc + danh sách */
    async function taiDanhSach() {
      danhSachDon = (await api.get('/orders')) || [];
      veThanhLoc();
      veDanhSachDon();
    }

    /** Khởi động trang quản lý đơn hàng */
    async function khoiDong() {
      if (!batBuocAdmin()) return;
      dungKhungAdmin('orders');
      if (tuKhoaTim) {
        const goiY = document.getElementById('goi-y-tim');
        if (goiY) {
          goiY.hidden = false;
          goiY.textContent = `Đang lọc theo từ khóa: “${tuKhoaTim}”`;
        }
      }

      try {
        await taiDanhSach();
      } catch {
        danhSachEl.innerHTML = '<div class="card empty-block">Không tải được danh sách đơn hàng</div>';
      }
      veIcon();
    }

    khoiDong();
  </script>
</body>
</html>
