<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý kho hàng - Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div style="display:flex;min-height:100vh;background:var(--surface)">
    <aside
      id="admin-aside"
      style="
        position:fixed;left:0;top:0;height:100vh;width:16rem;
        background:var(--surface-lowest);border-right:1px solid var(--outline-variant);
        display:flex;flex-direction:column;padding:1.5rem 1rem;z-index:40;box-sizing:border-box
      "
    ></aside>
    <main
      id="app"
      style="margin-left:16rem;flex:1;padding:2rem;max-width:80rem;width:100%;box-sizing:border-box;min-width:0"
    ></main>
  </div>
  <script type="module" src="../js/pages/admin/inventory.js"></script>
</body>
</html>
