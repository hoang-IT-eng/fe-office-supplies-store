<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết đơn hàng - Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />

  <!-- CSS RIÊNG của trang chi tiết đơn hàng (admin) -->
  <style>
    /* ===== Thẻ đầu trang: mã đơn + ô đổi trạng thái ===== */
    .order-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .order-header-left {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .order-header-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .order-header-icon .lucide {
      width: 1.375rem;
      height: 1.375rem;
    }
    .order-code {
      font-size: 1.25rem;
      font-weight: 800;
    }
    .order-created {
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .order-status-chip {
      margin-top: 0.5rem;
    }
    .order-status-select {
      min-width: 200px;
    }

    /* ===== Khối vận chuyển GHN ===== */
    .order-ghn-header {
      margin-bottom: 1rem;
    }
    .order-ghn-grid {
      display: grid;
      gap: 0.75rem;
      font-size: 0.875rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .order-ghn-full {
      grid-column: 1 / -1;
    }
    .order-ghn-log {
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--outline-variant);
    }
    .order-ghn-log-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--on-surface-variant);
      margin-bottom: 0.5rem;
    }
    .order-ghn-log-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-height: 10rem;
      overflow-y: auto;
      font-size: 0.875rem;
    }
    .order-ghn-empty {
      font-size: 0.875rem;
    }

    /* ===== Hai cột: khách hàng | thông tin nhận hàng ===== */
    .order-two-columns {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .order-info-list {
      font-size: 0.875rem;
      line-height: 1.9;
    }
    .order-info-row {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .order-info-row .lucide {
      width: 0.875rem;
      height: 0.875rem;
      color: var(--on-surface-variant);
    }
    .order-note {
      margin-top: 0.5rem;
      padding-top: 0.25rem;
      border-top: 1px solid var(--outline-variant);
      color: var(--on-surface-variant);
      font-style: italic;
    }

    /* ===== Hàng dưới: bảng sản phẩm (rộng) + tổng kết (hẹp) ===== */
    .order-bottom-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 1rem;
    }
    .order-items-card {
      flex: 2 1 420px;
      min-width: 0;
    }
    .order-summary-card {
      flex: 1 1 260px;
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-aside" id="admin-aside"></aside>

    <main class="admin-content">
      <div class="admin-page">
        <a href="orders.html" class="back-link">
          <i data-lucide="arrow-left"></i> Quay lại danh sách đơn hàng
        </a>

        <p class="loading-block" id="khoi-dang-tai">Đang tải...</p>

        <!-- Thông báo khi không tải được đơn -->
        <div class="card empty-block" id="khoi-loi" hidden></div>

        <div class="admin-page" id="khoi-don-hang" hidden>
          <!-- Đầu trang: mã đơn, ngày tạo, chip trạng thái, ô đổi trạng thái -->
          <section class="card card-elevated order-header">
            <div class="order-header-left">
              <div class="order-header-icon"><i data-lucide="receipt"></i></div>
              <div>
                <div class="order-code mono" id="ma-don"></div>
                <div class="order-created muted" id="ngay-tao"></div>
                <div class="order-status-chip" id="khoi-chip-trang-thai"></div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label" for="o-trang-thai">Cập nhật trạng thái</label>
              <select id="o-trang-thai" class="form-input order-status-select"></select>
            </div>
          </section>

          <!-- Vận chuyển GHN: thông tin vận đơn -->
          <section class="card">
            <div class="order-ghn-header">
              <h2 class="block-title"><i data-lucide="truck"></i> Vận chuyển GHN</h2>
            </div>

            <!-- Đã có vận đơn: hiện mã, trạng thái, dự kiến giao, lịch sử -->
            <div class="order-ghn-grid" id="khoi-thong-tin-ghn" hidden>
              <div><span class="muted">Mã vận đơn:</span> <b class="mono" id="ma-van-don"></b></div>
              <div><span class="muted">Trạng thái GHN:</span> <b id="trang-thai-ghn"></b></div>
              <div class="order-ghn-full" id="khoi-du-kien-giao" hidden>
                <span class="muted">Dự kiến giao:</span> <span id="ngay-du-kien"></span>
              </div>
              <div class="order-ghn-full order-ghn-log" id="khoi-lich-su" hidden>
                <p class="order-ghn-log-title">Lịch sử vận chuyển</p>
                <div class="order-ghn-log-list" id="danh-sach-lich-su"></div>
              </div>
            </div>

            <!-- Chưa có vận đơn: hiện câu hướng dẫn -->
            <p class="muted order-ghn-empty" id="khoi-chua-co-van-don" hidden></p>
          </section>

          <!-- Khách hàng + thông tin nhận hàng -->
          <div class="order-two-columns">
            <section class="card">
              <h2 class="block-title"><i data-lucide="user"></i> Khách hàng</h2>
              <div class="order-info-list">
                <div class="cell-strong" id="ten-khach-hang"></div>
                <div class="order-info-row muted" id="khoi-email-khach" hidden>
                  <i data-lucide="mail"></i> <span id="email-khach"></span>
                </div>
              </div>
            </section>

            <section class="card">
              <h2 class="block-title"><i data-lucide="map-pin"></i> Thông tin nhận hàng</h2>
              <div class="order-info-list">
                <div><span class="muted">Người nhận:</span> <b id="ten-nguoi-nhan"></b></div>
                <div class="order-info-row">
                  <i data-lucide="phone"></i> <span id="dien-thoai"></span>
                </div>
                <div><span class="muted">Địa chỉ:</span> <span id="dia-chi-giao"></span></div>
                <div class="order-note" id="khoi-ghi-chu" hidden></div>
              </div>
            </section>
          </div>

          <!-- Bảng sản phẩm + tổng kết tiền -->
          <div class="order-bottom-row">
            <section class="card card-flush order-items-card">
              <div class="list-header">Chi tiết sản phẩm</div>
              <div class="table-scroll">
                <table class="data-table">
                  <thead class="data-table-head">
                    <tr>
                      <th>Tên sản phẩm</th>
                      <th class="cell-money">Đơn giá</th>
                      <th class="cell-quantity">SL</th>
                      <th class="cell-quantity">Tồn kho</th>
                      <th class="cell-money">Thành tiền</th>
                    </tr>
                  </thead>
                  <tbody id="danh-sach-san-pham"></tbody>
                </table>
              </div>
            </section>

            <section class="card order-summary-card">
              <h2 class="block-title">Tổng kết</h2>
              <div class="summary-list" id="khoi-tong-ket"></div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '../js/api.js';
    import {
      dinhDangTien,
      dinhDangNgay,
      nhanTrangThaiDon,
      chipTrangThaiDon,
      nhanTrangThaiGhn,
      chuoiAnToan,
    } from '../js/format.js';
    import { thongBao } from '../js/toast.js';
    import { dungKhungAdmin, veIcon, batBuocAdmin } from '../js/layout.js';

    // Id đơn hàng lấy từ URL: order-detail.html?id=...
    const donHangId = new URLSearchParams(location.search).get('id');

    // Trạng thái được phép chuyển tiếp (giống quy tắc của backend)
    const TRANG_THAI_KE_TIEP = {
      PENDING: ['CONFIRMED', 'CANCELLED'],
      CONFIRMED: ['SHIPPING', 'CANCELLED'],
      SHIPPING: ['COMPLETED', 'CANCELLED'],
      COMPLETED: [],
      CANCELLED: [],
    };

    let donHang = null; // dữ liệu đơn từ API
    let tracking = null; // dữ liệu theo dõi GHN (có thể null)

    // ------------------------------------------------- Vẽ từng khối của trang

    /** Vẽ đầu trang: mã đơn, ngày tạo, chip và ô chọn trạng thái */
    function veKhoiDauTrang() {
      document.getElementById('ma-don').textContent = `#${donHang.code}`;
      document.getElementById('ngay-tao').textContent = `Tạo lúc ${dinhDangNgay(donHang.createdAt)}`;

      document.getElementById('khoi-chip-trang-thai').innerHTML = `
        <span class="chip ${chipTrangThaiDon[donHang.status] || 'chip-neutral'}">
          ${nhanTrangThaiDon[donHang.status] || chuoiAnToan(donHang.status)}
        </span>`;

      // Ô select chỉ liệt kê trạng thái hiện tại + các trạng thái được phép chuyển tiếp
      const cacTrangThaiKeTiep = TRANG_THAI_KE_TIEP[donHang.status] || [];
      const oTrangThai = document.getElementById('o-trang-thai');
      oTrangThai.innerHTML = [donHang.status, ...cacTrangThaiKeTiep]
        .map(
          (trangThai) =>
            `<option value="${trangThai}" ${donHang.status === trangThai ? 'selected' : ''}>${
              nhanTrangThaiDon[trangThai]
            }</option>`,
        )
        .join('');
      oTrangThai.disabled = cacTrangThaiKeTiep.length === 0;
    }

    /** Vẽ khối vận chuyển GHN: thông tin vận đơn */
    function veKhoiGhn() {
      const coVanDon = Boolean(donHang.ghnOrderCode);

      document.getElementById('khoi-thong-tin-ghn').hidden = !coVanDon;
      document.getElementById('khoi-chua-co-van-don').hidden = coVanDon;

      if (!coVanDon) {
        document.getElementById('khoi-chua-co-van-don').textContent = donHang.toDistrictId
          ? 'Chưa có vận đơn GHN. Vận đơn sẽ tự tạo khi chuyển trạng thái "Đã xác nhận".'
          : 'Đơn hàng cũ chưa có mã địa chỉ GHN — không thể tạo vận đơn tự động.';
        return;
      }

      const nhanGhn = tracking?.ghnStatusLabel || nhanTrangThaiGhn[donHang.ghnStatus] || donHang.ghnStatus || '—';
      document.getElementById('ma-van-don').textContent = donHang.ghnOrderCode;
      document.getElementById('trang-thai-ghn').textContent = nhanGhn;

      const khoiDuKien = document.getElementById('khoi-du-kien-giao');
      khoiDuKien.hidden = !donHang.ghnExpectedDelivery;
      if (donHang.ghnExpectedDelivery) {
        document.getElementById('ngay-du-kien').textContent = dinhDangNgay(donHang.ghnExpectedDelivery);
      }

      // Lịch sử di chuyển kiện hàng do GHN trả về
      const khoiLichSu = document.getElementById('khoi-lich-su');
      const coLichSu = Boolean(tracking?.log?.length);
      khoiLichSu.hidden = !coLichSu;
      if (coLichSu) {
        document.getElementById('danh-sach-lich-su').innerHTML = tracking.log
          .map(
            (dong) =>
              `<div>${dong.updated_date ? dinhDangNgay(dong.updated_date) : ''} — ${chuoiAnToan(
                dong.status || dong.action || '',
              )}</div>`,
          )
          .join('');
      }
    }

    /** Vẽ thông tin khách hàng và thông tin nhận hàng */
    function veThongTinKhach() {
      document.getElementById('ten-khach-hang').textContent = donHang.user?.fullName || '—';

      const khoiEmail = document.getElementById('khoi-email-khach');
      khoiEmail.hidden = !donHang.user?.email;
      if (donHang.user?.email) document.getElementById('email-khach').textContent = donHang.user.email;

      document.getElementById('ten-nguoi-nhan').textContent = donHang.shippingName || '';
      document.getElementById('dien-thoai').textContent = donHang.shippingPhone || '';
      document.getElementById('dia-chi-giao').textContent = donHang.shippingAddress || '';

      const khoiGhiChu = document.getElementById('khoi-ghi-chu');
      khoiGhiChu.hidden = !donHang.note;
      khoiGhiChu.textContent = donHang.note ? `Ghi chú: ${donHang.note}` : '';
    }

    /** Vẽ các dòng tiền: tạm tính, giảm giá, phí GHN, tổng cộng */
    function veTongKet() {
      const tienHang = Number(donHang.subtotalAmount ?? donHang.totalAmount);
      const tienGiam = Number(donHang.discountAmount ?? 0);
      const phiShip = Number(donHang.shippingFee ?? 0);
      const maVoucher = donHang.voucher?.code ? ` (${chuoiAnToan(donHang.voucher.code)})` : '';

      document.getElementById('khoi-tong-ket').innerHTML = `
        <div class="summary-row">
          <span class="summary-row-label">Số sản phẩm</span>
          <span class="summary-row-value">${donHang.items.length}</span>
        </div>
        <div class="summary-row">
          <span class="summary-row-label">Tạm tính</span>
          <span class="summary-row-value">${dinhDangTien(tienHang)}</span>
        </div>
        ${
          tienGiam > 0
            ? `<div class="summary-row summary-row-discount">
                 <span>Giảm giá${maVoucher}</span>
                 <span class="summary-row-value">-${dinhDangTien(tienGiam)}</span>
               </div>`
            : ''
        }
        ${
          phiShip > 0
            ? `<div class="summary-row">
                 <span class="summary-row-label">Phí GHN</span>
                 <span class="summary-row-value">${dinhDangTien(phiShip)}</span>
               </div>`
            : ''
        }
        <div class="divider"></div>
        <div class="summary-total">
          <span class="summary-total-label">Tổng cộng</span>
          <span class="summary-total-value">${dinhDangTien(donHang.totalAmount)}</span>
        </div>`;
    }

    /** Chip tồn kho hiện tại của sản phẩm (số lượng kho, không phải SL trong đơn) */
    function taoHtmlTonKho(dong) {
      const kho = dong.product?.inventory;
      if (!dong.product || kho == null) {
        return '<span class="muted">—</span>';
      }

      const soLuong = Number(kho.quantity) || 0;
      const nguong = kho.lowStockThreshold ?? 5;
      if (soLuong <= 0) return '<span class="chip chip-danger">Hết hàng</span>';
      if (soLuong <= nguong) {
        return `<span class="chip chip-warning">Sắp hết · ${soLuong}</span>`;
      }
      return `<span class="chip chip-success">Còn ${soLuong}</span>`;
    }

    /** Vẽ bảng sản phẩm trong đơn */
    function veBangSanPham() {
      document.getElementById('danh-sach-san-pham').innerHTML = donHang.items
        .map(
          (dong) => `
            <tr>
              <td class="cell-strong">${chuoiAnToan(dong.productName)}</td>
              <td class="cell-money">${dinhDangTien(dong.unitPrice)}</td>
              <td class="cell-quantity">${dong.quantity}</td>
              <td class="cell-quantity">${taoHtmlTonKho(dong)}</td>
              <td class="cell-money cell-strong">${dinhDangTien(dong.subtotal)}</td>
            </tr>`,
        )
        .join('');
    }

    /** Vẽ lại toàn bộ trang theo dữ liệu đơn + tracking hiện tại */
    function veTrang() {
      document.getElementById('khoi-dang-tai').hidden = true;
      document.getElementById('khoi-don-hang').hidden = false;

      veKhoiDauTrang();
      veKhoiGhn();
      veThongTinKhach();
      veTongKet();
      veBangSanPham();
      veIcon();
    }

    // ------------------------------------------------------------ Gọi API

    /** Gọi API lấy chi tiết đơn rồi vẽ lại trang */
    async function taiDonHang() {
      donHang = await api.get(`/orders/${donHangId}`);
      veTrang();
    }

    /** Đổi trạng thái đơn theo lựa chọn trong ô select */
    async function xuLyDoiTrangThai(trangThai) {
      try {
        await api.patch(`/orders/${donHangId}/status`, { status: trangThai });
        thongBao.thanhCong('Đã cập nhật trạng thái');
        await taiDonHang();
        if (donHang.ghnOrderCode) await dongBoTracking();
      } catch (loi) {
        const noiDung = loi?.response?.data?.message;
        thongBao.loi(Array.isArray(noiDung) ? noiDung[0] : noiDung || 'Không cập nhật được trạng thái');
        await taiDonHang(); // tải lại để ô select trở về trạng thái thật
      }
    }

    /** Gọi API đồng bộ trạng thái vận chuyển từ GHN */
    async function dongBoTracking() {
      if (!donHang?.ghnOrderCode) return;
      try {
        tracking = await api.post(`/shipping/orders/${donHangId}/sync-tracking`);
        // GHN có thể đẩy đơn sang trạng thái mới → cập nhật lại dữ liệu đang hiển thị
        if (tracking.orderStatus) {
          donHang.status = tracking.orderStatus;
          donHang.ghnStatus = tracking.ghnStatus;
        }
      } catch (loi) {
        thongBao.loi(loi?.response?.data?.message || 'Không đồng bộ được trạng thái GHN');
      }
      veTrang();
    }

    /** Hiện thông báo lỗi thay cho nội dung trang */
    function hienLoi(noiDung) {
      document.getElementById('khoi-dang-tai').hidden = true;
      document.getElementById('khoi-don-hang').hidden = true;
      const khoiLoi = document.getElementById('khoi-loi');
      khoiLoi.hidden = false;
      khoiLoi.textContent = noiDung;
    }

    /** Khởi động trang chi tiết đơn hàng (admin) */
    async function khoiDong() {
      if (!batBuocAdmin()) return;
      dungKhungAdmin('orders');

      if (!donHangId) {
        hienLoi('Không tìm thấy đơn hàng');
        veIcon();
        return;
      }

      document
        .getElementById('o-trang-thai')
        .addEventListener('change', (suKien) => xuLyDoiTrangThai(suKien.target.value));

      try {
        await taiDonHang();
        if (donHang.ghnOrderCode) await dongBoTracking();
      } catch (loi) {
        hienLoi(loi?.response?.data?.message || 'Không tải được chi tiết đơn hàng');
      }
      veIcon();
    }

    khoiDong();
  </script>
</body>
</html>
